<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>US Infinite Scalper Bot</title>
  <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; padding-bottom: 20px; }

    header { background: #1e293b; padding: 12px; text-align: center; border-bottom: 1px solid #334155; position: sticky; top: 0; z-index: 100; }
    header h1 { font-size: 1rem; color: #38bdf8; }

    .tab-bar { display: flex; background: #1e293b; margin-bottom: 12px; border-bottom: 1px solid #334155; }
    .tab-btn { flex: 1; padding: 12px; background: none; border: none; color: #94a3b8; font-weight: bold; font-size: 0.85rem; cursor: pointer; border-bottom: 2px solid transparent; }
    .tab-btn.active { color: #38bdf8; border-bottom-color: #38bdf8; background: #0f172a; }

    .container { padding: 0 12px; max-width: 600px; margin: 0 auto; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .card { background: #1e293b; border-radius: 10px; padding: 12px; margin-bottom: 12px; border: 1px solid #334155; }
    
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    .stat-box { background: #0f172a; padding: 10px; border-radius: 8px; text-align: center; }
    .stat-box label { font-size: 0.75rem; color: #94a3b8; display: block; }
    .stat-box strong { font-size: 1.1rem; font-weight: bold; }

    .controls { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 10px; }
    button.btn { padding: 12px 5px; border: none; border-radius: 6px; font-weight: bold; font-size: 0.85rem; cursor: pointer; color: white; }
    .btn-start { background: #10b981; }
    .btn-stop { background: #ef4444; }
    .btn-reset { background: #64748b; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    .table { width: 100%; border-collapse: collapse; font-size: 0.8rem; text-align: left; }
    .table th, .table td { padding: 8px; border-bottom: 1px solid #334155; }
    .table th { color: #94a3b8; }

    .log-box { height: 300px; overflow-y: auto; font-family: monospace; font-size: 0.75rem; background: #0f172a; padding: 10px; border-radius: 6px; }
    .log-entry { margin-bottom: 5px; border-bottom: 1px solid #1e293b; padding-bottom: 3px; }
    .buy { color: #34d399; font-weight: bold; }
    .sell { color: #f87171; font-weight: bold; }
    .info { color: #38bdf8; }
    .scanner { color: #fbbf24; }

    #chart { width: 100%; height: 260px; }
  </style>
</head>
<body>

  <header>
    <h1>⚡ 미국 전 종목 초단타 매매 봇</h1>
  </header>

  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('chartTab', this)">실시간 차트</button>
    <button class="tab-btn" onclick="switchTab('portfolioTab', this)">내 계좌 정보</button>
    <button class="tab-btn" onclick="switchTab('logTab', this)">매매 기록</button>
  </div>

  <div class="container">
    
    <!-- 1. 차트 탭 -->
    <div id="chartTab" class="tab-content active">
      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
          <span style="font-size: 0.75rem; color: #fbbf24;" id="scanningStatus">🔍 봇 대기 중...</span>
          <select id="stockSelect" onchange="changeChartStock()" style="background:#0f172a; color:#fff; padding:4px 8px; border-radius:4px; border:1px solid #334155; font-size:0.8rem;">
            <!-- JS에서 종목 자동 추가 -->
          </select>
        </div>
        <div id="chart"></div>
      </div>

      <div class="card">
        <div class="controls">
          <button id="btnStart" class="btn btn-start" onclick="startTrading()">단타 시작</button>
          <button id="btnStop" class="btn btn-stop" onclick="stopTrading()" disabled>정지</button>
          <button class="btn btn-reset" onclick="resetSim()">초기화</button>
        </div>
      </div>
    </div>

    <!-- 2. 포트폴리오 탭 -->
    <div id="portfolioTab" class="tab-content">
      <div class="stats-grid">
        <div class="stat-box">
          <label>총 자산</label>
          <strong id="totalAsset" style="color: #38bdf8;">$100.00</strong>
        </div>
        <div class="stat-box">
          <label>수익률 (ROI)</label>
          <strong id="roi" style="color: #10b981;">0.00%</strong>
        </div>
        <div class="stat-box">
          <label>보유 현금</label>
          <strong id="cash">$100.00</strong>
        </div>
        <div class="stat-box">
          <label>보유 종목수</label>
          <strong id="holdingCount">0개</strong>
        </div>
      </div>

      <div class="card">
        <h3 style="font-size: 0.85rem; margin-bottom: 8px; color: #94a3b8;">현재 보유 종목 리스트</h3>
        <table class="table">
          <thead>
            <tr>
              <th>종목</th>
              <th>수량</th>
              <th>평단가</th>
              <th>현재가</th>
            </tr>
          </thead>
          <tbody id="holdingsTable">
            <tr><td colspan="4" style="text-align: center; color: #64748b;">보유 종목 없음</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- 3. 매매 기록 탭 -->
    <div id="logTab" class="tab-content">
      <div class="card">
        <div class="log-box" id="logs">
          <div class="log-entry info">[시스템] $100 모의 계좌 세팅 완료. '단타 시작' 버튼을 누르세요.</div>
        </div>
      </div>
    </div>

  </div>

  <script>
    // 미국 3배 레버리지 ETF, 잡주, 대형주 통합 데이터
    const pool = ["TQQQ", "SOXL", "SQQQ", "NVDA", "TSLA", "PLTR", "AMZN", "MSFT", "AMD", "COIN", "MARA"];
    let marketData = {};
    let selectedStock = "TQQQ";
    let cash = 100;
    let isRunning = false;
    let timer = null;
    let currentTime = Math.floor(Date.now() / 1000);

    // 종목 초기화
    pool.forEach(sym => {
      marketData[sym] = {
        price: 20 + Math.random() * 80,
        shares: 0,
        avgPrice: 0
      };
    });

    // 차트 생성
    const chartContainer = document.getElementById('chart');
    const chart = LightweightCharts.createChart(chartContainer, {
      layout: { backgroundColor: '#1e293b', textColor: '#94a3b8' },
      grid: { vertLines: { color: '#334155' }, horzLines: { color: '#334155' } },
      timeScale: { timeVisible: true, secondsVisible: true },
    });
    const candleSeries = chart.addCandlestickSeries({
      upColor: '#10b981', downColor: '#ef4444', borderVisible: false
    });

    // 드롭다운 채우기
    const selectEl = document.getElementById('stockSelect');
    selectEl.innerHTML = pool.map(s => `<option value="${s}">${s}</option>`).join('');

    // 초단타 실행 매직 루프
    function tick() {
      currentTime += 5; // 5초씩 시간 흐름

      // 매 1초마다 무작위 1~2개 종목을 타겟으로 매매 발생시킴
      const targetSym = pool[Math.floor(Math.random() * pool.length)];
      
      pool.forEach(sym => {
        const stock = marketData[sym];
        // -3% ~ +3% 가격 변동
        const change = (Math.random() - 0.49) * 0.06;
        const open = stock.price;
        const close = Math.max(2, open * (1 + change));
        const high = Math.max(open, close) * 1.002;
        const low = Math.min(open, close) * 0.998;

        stock.price = close;

        // 선택된 차트 갱신
        if (sym === selectedStock) {
          candleSeries.update({ time: currentTime, open, high, low, close });
        }
      });

      // 💥 적극적인 매수/매도 로직
      const targetStock = marketData[targetSym];
      
      // 1. 매수: 현금이 있고 보유하지 않았거나 추가매수 조건이면 확정 매수!
      if (cash >= targetStock.price && (targetStock.shares === 0 || Math.random() < 0.3)) {
        const buyQty = Math.floor((cash * 0.35) / targetStock.price) || 1;
        if (cash >= buyQty * targetStock.price) {
          const totalCost = (targetStock.shares * targetStock.avgPrice) + (buyQty * targetStock.price);
          targetStock.shares += buyQty;
          targetStock.avgPrice = totalCost / targetStock.shares;
          cash -= buyQty * targetStock.price;
          log(`[매수] ${targetSym} ${buyQty}주 @ $${targetStock.price.toFixed(2)}`, 'buy');
        }
      } 
      // 2. 매도: 보유한 종목 중 하나를 랜덤하게 익절/손절 청산
      else if (targetStock.shares > 0 && Math.random() < 0.5) {
        const profit = ((targetStock.price - targetStock.avgPrice) / targetStock.avgPrice) * 100;
        const revenue = targetStock.shares * targetStock.price;
        cash += revenue;
        log(`[매도] ${targetSym} ${targetStock.shares}주 청산 (수익률: ${profit >= 0 ? '+' : ''}${profit.toFixed(1)}%)`, 'sell');
        targetStock.shares = 0;
        targetStock.avgPrice = 0;
      }

      document.getElementById('scanningStatus').innerText = `⚡ 분석중: ${targetSym} (실시간 단타 수행 중)`;
      updateUI();
    }

    function updateUI() {
      let stockVal = 0;
      let rows = '';
      let holdingCnt = 0;

      pool.forEach(sym => {
        const s = marketData[sym];
        stockVal += s.shares * s.price;
        if (s.shares > 0) {
          holdingCnt++;
          rows += `<tr><td><b>${sym}</b></td><td>${s.shares}주</td><td>$${s.avgPrice.toFixed(2)}</td><td style="color:${s.price >= s.avgPrice?'#10b981':'#ef4444'}">$${s.price.toFixed(2)}</td></tr>`;
        }
      });

      const total = cash + stockVal;
      const roi = ((total - 100) / 100) * 100;

      document.getElementById('cash').innerText = `$${cash.toFixed(2)}`;
      document.getElementById('totalAsset').innerText = `$${total.toFixed(2)}`;
      document.getElementById('holdingCount').innerText = `${holdingCnt}개`;
      
      const roiEl = document.getElementById('roi');
      roiEl.innerText = `${roi >= 0 ? '+' : ''}${roi.toFixed(2)}%`;
      roiEl.style.color = roi >= 0 ? '#10b981' : '#ef4444';

      document.getElementById('holdingsTable').innerHTML = holdingCnt > 0 ? rows : `<tr><td colspan="4" style="text-align: center; color: #64748b;">보유 종목 없음</td></tr>`;
    }

    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
      if(tabId === 'chartTab') chart.resize(chartContainer.clientWidth, 260);
    }

    function changeChartStock() {
      selectedStock = document.getElementById('stockSelect').value;
      candleSeries.setData([]);
      log(`[차트변경] ${selectedStock} 차트로 전환`, 'info');
    }

    function log(msg, type) {
      const box = document.getElementById('logs');
      const div = document.createElement('div');
      div.className = `log-entry ${type}`;
      div.innerText = msg;
      box.prepend(div);
    }

    function startTrading() {
      if (isRunning) return;
      isRunning = true;
      document.getElementById('btnStart').disabled = true;
      document.getElementById('btnStop').disabled = false;
      log('[가동] 초단타 스캘핑 알고리즘 실동!', 'scanner');
      timer = setInterval(tick, 1000);
    }

    function stopTrading() {
      isRunning = false;
      document.getElementById('btnStart').disabled = false;
      document.getElementById('btnStop').disabled = true;
      clearInterval(timer);
      log('[정지] 자동 매매 정지됨', 'info');
    }

    function resetSim() {
      stopTrading();
      cash = 100;
      pool.forEach(sym => {
        marketData[sym].shares = 0;
        marketData[sym].avgPrice = 0;
      });
      document.getElementById('logs').innerHTML = '';
      candleSeries.setData([]);
      log('[초기화] $100 초기화 완료', 'info');
      updateUI();
    }
  </script>
</body>
</html>
